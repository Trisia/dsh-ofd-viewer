# pnpm 配置。settings 文档：https://pnpm.io/settings

# esbuild 的 postinstall 会下载并放置平台原生二进制，构建必须放行；
# 未列出的依赖一律不允许执行安装脚本（strictDepBuilds 默认开启，遇到未审批的脚本会直接失败）。
allowBuilds:
  esbuild: true

# pnpm 默认要求依赖发布满 1440 分钟才可安装，用于降低供应链投毒风险。
# 本项目依赖的 @ofdrw/* 是刚发布的 0.1.7，这里按包名例外放行，保证 lockfile 可解析。
minimumReleaseAgeExclude:
  - '@ofdrw/*'
